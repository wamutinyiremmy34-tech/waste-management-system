services:
  db:
    image: postgis/postgis:16-3.4
    container_name: ecotrack_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecotrack
      POSTGRES_PASSWORD: ecotrack_dev_pw
      POSTGRES_DB: ecotrack_dev
    ports:
      - "5432:5432"
    volumes:
      - ecotrack_db_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgis-init.sh:/docker-entrypoint-initdb.d/postgis-init.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecotrack -d ecotrack_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ecotrack_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecotrack_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://ecotrack:ecotrack_dev_pw@db:5432/ecotrack_dev
      REDIS_URL: redis://redis:6379/0
      SEED_ON_START: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ecotrack_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    container_name: ecotrack_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  ecotrack_db_data:
  ecotrack_uploads:
